{% extends "base.html" %}
{% block title %}Watchlist - QuantVAT{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/watchlist.css') }}">
{% endblock %}
{% block content %}
<div class="container">
    <div class="controls-bar">
        <h1 style="margin: 0; font-size: 1.5rem; color: #fff;">Watchlist</h1>
        
        <select id="sortSelect" onchange="renderBubbles()" style="background: var(--bg-card); color: white; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px;">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
        </select>
    </div>

    <div id="bubble-canvas" class="bubble-container"></div>
</div>

<div id="coinOverlay" class="detail-overlay" onclick="handleOverlayClick(event)">
    <div class="detail-card" onclick="event.stopPropagation()">
        <div class="close-btn" onclick="closeOverlay()" style="position:absolute; top:15px; right:20px; cursor:pointer; color:var(--text-dim); font-size: 1.4rem; line-height: 1;">×</div>
        <h1 id="ov-symbol" style="margin: 0; color: white; font-size: 1.8rem;">--</h1>
        <p id="ov-name" style="color: var(--text-dim); margin-bottom: 20px;">--</p>

        <div class="metric-grid">
            <div class="m-box"><span class="m-lbl">Price</span><span id="ov-price" class="m-val">--</span></div>
            <div class="m-box"><span class="m-lbl">VTMR</span><span id="ov-vtmr" class="m-val" style="color: var(--accent-green)">--</span></div>
            <div class="m-box"><span class="m-lbl">24H CHG</span><span id="ov-24h" class="m-val">--</span></div>
            <div class="m-box"><span class="m-lbl">7D CHG</span><span id="ov-7d" class="m-val">--</span></div>
            <div class="m-box"><span class="m-lbl">1M CHG</span><span id="ov-30d" class="m-val">--</span></div>
            <div class="m-box"><span class="m-lbl">1Y CHG</span><span id="ov-1y" class="m-val">--</span></div>
            <div class="m-box" style="grid-column: span 1;"><span class="m-lbl">Market Cap</span><span id="ov-mcap" class="m-val">--</span></div>
            <div class="m-box" style="grid-column: span 1;"><span class="m-lbl">Added On</span><span id="ov-added" class="m-val">--</span></div>
        </div>

        <div class="action-group">
            <button class="btn-act btn-refresh" onclick="refreshData()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                Refresh
            </button>
            <button class="btn-act btn-dive" onclick="goToDiver()">
                Dive
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="7" y1="17" x2="17" y2="7"></line>
                    <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
            </button>
            <button class="btn-act btn-del" onclick="deleteCurrent()" title="Remove from watchlist">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
    let watchlistData = {{ watchlist | tojson }};
    let currentCoin = null;

    function renderBubbles() {
        const canvas = document.getElementById('bubble-canvas');
        const sort = document.getElementById('sortSelect').value;
        canvas.innerHTML = '';

        if (!watchlistData || watchlistData.length === 0) {
            canvas.innerHTML = `
                <div class="wl-empty">
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5;">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="12" y1="18" x2="12" y2="12"></line>
                        <line x1="9" y1="15" x2="15" y2="15"></line>
                    </svg>
                    <p>Your watchlist is empty.<br>Add tokens from the Deep Diver or Screenr to track them here.</p>
                    <a href="{{ url_for('main.deep_diver') }}">
                        Go to Deep Diver
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </a>
                </div>
            `;
            return;
        }

        const sorted = [...watchlistData].sort((a, b) => {
            return sort === 'newest' 
                ? b.added_at.localeCompare(a.added_at) 
                : a.added_at.localeCompare(b.added_at);
        });

        sorted.forEach(coin => {
            const chg = parseFloat(coin.chg_24h) || 0;
            const el = document.createElement('div');
            
            let colorClass = 'flat';
            if (chg > 0) colorClass = 'pos';
            if (chg < 0) colorClass = 'neg';

            el.className = `bubble ${colorClass}`;
            el.innerHTML = `
                <span class="b-sym">${coin.symbol}</span>
                <span class="b-chg">${chg > 0 ? '+' : ''}${chg.toFixed(2)}%</span>
            `;
            
            el.onclick = () => openOverlay(coin);
            canvas.appendChild(el);
        });
    }

    function openOverlay(coin) {
        currentCoin = coin;
        document.getElementById('ov-symbol').innerText = coin.symbol;
        document.getElementById('ov-name').innerText = coin.name || 'Unknown Token';
        document.getElementById('ov-price').innerText = coin.price || '--';
        document.getElementById('ov-vtmr').innerText = coin.vtmr || '--';
        document.getElementById('ov-mcap').innerText = coin.mcap || '--';
        document.getElementById('ov-added').innerText = coin.added_at || '--';
        
        ['24h', '7d', '30d', '1y'].forEach(t => {
            const val = coin[`chg_${t}`];
            const el = document.getElementById(`ov-${t}`);
            if (val === undefined || val === null || val === '--') {
                el.innerText = '--';
                el.style.color = 'var(--text-dim)';
                return;
            }
            const num = parseFloat(val);
            el.innerText = (num > 0 ? '+' : '') + num.toFixed(2) + '%';
            el.style.color = num < 0 ? 'var(--accent-red)' : 'var(--accent-green)';
        });

        document.getElementById('coinOverlay').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeOverlay() {
        document.getElementById('coinOverlay').style.display = 'none';
        document.body.style.overflow = '';
        setTimeout(() => { currentCoin = null; }, 300);
    }

    function handleOverlayClick(e) {
        if (e.target === e.currentTarget) closeOverlay();
    }

    async function refreshData() {
        if (!currentCoin) return;
        const btn = document.querySelector('.btn-refresh');
        if (btn.disabled) return;
        
        btn.disabled = true;
        const originalHTML = btn.innerHTML;
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg> Wait`;
        
        try {
            const res = await fetch(`/api/dive/${currentCoin.coin_id}`);
            const d = await res.json();
            
            if (d.status === 'success') {
                const index = watchlistData.findIndex(c => c.coin_id === currentCoin.coin_id);
                if (index !== -1) {
                    watchlistData[index] = {
                        ...watchlistData[index],
                        price: d.vitals.price,
                        vtmr: d.ratios.vtmr,
                        mcap: d.vitals.mcap,
                        chg_24h: d.velocity.h24,
                        chg_7d: d.velocity.d7,
                        chg_30d: d.velocity.m1,
                        chg_1y: d.velocity.y1
                    };
                    renderBubbles();
                    openOverlay(watchlistData[index]); 
                }
                btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Done`;
                setTimeout(() => { btn.innerHTML = originalHTML; btn.disabled = false; }, 1200);
            } else {
                throw new Error(d.message || 'Refresh failed');
            }
        } catch(e) { 
            btn.innerText = 'Error';
            setTimeout(() => { btn.innerHTML = originalHTML; btn.disabled = false; }, 1500);
        }
    }

    function goToDiver() { 
        if (currentCoin) window.location.href = `/deep-diver?ticker=${encodeURIComponent(currentCoin.symbol)}`; 
    }

    async function deleteCurrent() {
        if (!currentCoin) return;
        if (!confirm('Remove this token from your watchlist?')) return;
        
        const targetId = currentCoin.coin_id;
        const btn = document.querySelector('.btn-del');
        btn.disabled = true;

        try {
            const res = await fetch('/api/watchlist/toggle', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token() }}'
                },
                body: JSON.stringify({ coin_id: targetId, action: 'remove' })
            });
            const data = await res.json();
            if (res.ok && data.status === 'success') {
                watchlistData = watchlistData.filter(c => c.coin_id !== targetId);
                renderBubbles();
                closeOverlay();
                btn.disabled = false;
            } else {
                alert('Failed to remove from watchlist.');
                btn.disabled = false;
            }
        } catch(e) {
            alert('Connection error. Please try again.');
            btn.disabled = false;
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeOverlay();
    });

    document.addEventListener('DOMContentLoaded', renderBubbles);
</script>
{% endblock %}
